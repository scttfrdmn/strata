name: hwloc
version: "2.11.2"
tier: library
description: "Hardware Locality 2.11.2 — NUMA and CPU topology discovery for MPI binding."
abi: linux-gnu-2.34
sources:
  - url: https://download.open-mpi.org/release/hwloc/v2.11/hwloc-2.11.2.tar.bz2
    sha256: f7f88fecae067100f1a1a915b658add0f4f71561259482910a69baea22fe8409
user_selectable: false

build_requires:
  - name: gcc
    min_version: "13"

provides:
  - name: hwloc
    version: "2.11.2"
  - name: hwloc
    version: "2"

runtime_requires:
  - name: glibc
    min_version: "2.34"

modulefile_env:
  - var: HWLOC_HOME
    path: ""
