name: openblas
version: "0.3.26"
tier: library
description: "OpenBLAS 0.3.26 — optimized BLAS/LAPACK for numpy, scipy, and R linear algebra."
abi: linux-gnu-2.34
sources:
  - url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.26/OpenBLAS-0.3.26.tar.gz
    sha256: 4e6e4f5cb14c209262e33e6816d70221a2fe49eb69eaf0a06f065598ac602c68

build_requires:
  - name: gcc
    min_version: "13"

provides:
  - name: openblas
    version: "0.3.26"
  - name: blas
    version: "3.11"
  - name: lapack
    version: "3.11"

runtime_requires:
  - name: glibc
    min_version: "2.34"

modulefile_env:
  - var: OPENBLAS_HOME
    path: ""
  - var: BLAS_HOME
    path: ""
  - var: LAPACK_HOME
    path: ""
