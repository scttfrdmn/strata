name: openblas
version: "0.3.28"
tier: library
description: "OpenBLAS 0.3.28 — optimized BLAS/LAPACK for numpy, scipy, and R linear algebra."
abi: linux-gnu-2.34
sources:
  - url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.28/OpenBLAS-0.3.28.tar.gz
    sha256: f1003466ad074e9b0c8d421a204121100b0751c96fc6fcf3d1456bd12f8a00a1

build_requires:
  - name: gcc
    min_version: "13"

provides:
  - name: openblas
    version: "0.3.28"
  - name: blas
    version: "3.12"
  - name: lapack
    version: "3.12"

runtime_requires:
  - name: glibc
    min_version: "2.34"

modulefile_env:
  - var: OPENBLAS_HOME
    path: ""
  - var: BLAS_HOME
    path: ""
  - var: LAPACK_HOME
    path: ""
