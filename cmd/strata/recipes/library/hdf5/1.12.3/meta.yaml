name: hdf5
version: "1.12.3"
tier: library
description: "HDF5 1.12.3 — hierarchical data format library required by netCDF, AlphaFold, and many scientific codes."
abi: linux-gnu-2.34
sources:
  - url: https://github.com/HDFGroup/hdf5/archive/refs/tags/hdf5-1_12_3.tar.gz
    sha256: 39e2e3e25f2263f2dc3370556c174952675d7ac51c4d6f7d4f5e8b3a8bd10ac6

build_requires:
  - name: gcc
    min_version: "13"

provides:
  - name: hdf5
    version: "1.12.3"

runtime_requires:
  - name: glibc
    min_version: "2.34"

modulefile_env:
  - var: HDF5_HOME
    path: ""
  - var: HDF5_DIR
    path: ""
