name: gcc
version: "14.2.0"
tier: core
description: "GNU Compiler Collection 14.2.0 — C, C++, and Fortran compilers."
abi: linux-gnu-2.34
sources:
  - url: https://ftp.gnu.org/gnu/gcc/gcc-14.2.0/gcc-14.2.0.tar.xz
    sha256: a7b39bc69cbf9e25826c5a60ab26477001f7c08d85cec04bc0e29cabed6f3cc9
provides:
  - name: gcc
    version: "14.2.0"
  - name: gfortran
    version: "14.2.0"
  - name: g++
    version: "14.2.0"
runtime_requires:
  - name: glibc
    min_version: "2.34"

modulefile_env:
  - var: GCC_HOME
    path: ""
  - var: CC
    path: "bin/gcc"
  - var: CXX
    path: "bin/g++"
  - var: FC
    path: "bin/gfortran"
